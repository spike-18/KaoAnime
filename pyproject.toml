[project]
name = "kaoanime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3",
    "lightning>=2.4",
    "mediapipe>=0.10",
    "mlflow>=2.0",
    "opencv-python>=4.8",
    "torch>=2.11.0",
    "torchmetrics[image]>=1.4",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]

