[project]
name = "kaoanime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc[gdrive]>=3.0",
    "fire>=0.6",
    "gdown>=5.0",
    "hydra-core>=1.3",
    "kaggle>=1.6",
    "lightning>=2.4",
    "mediapipe>=0.10",
    "mlflow>=2.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.7",
    "opencv-python>=4.8",
    "torch>=2.11.0",
    "torchmetrics[image]>=1.4",
    "torchvision>=0.26.0",
    "triton-rocm>=3.6.0", # for rocm7.2 support
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaoanime"]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
]
# Triton test client (torch-free): `uv sync --group serve`.
serve = [
    "tritonclient[http]>=2.40",
    "pillow>=10.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
triton-rocm = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
# url = "https://download.pytorch.org/whl/cu128"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory: allow short plotting variable names (E741) and
# imports placed mid-cell rather than at the top (E402).
"notebooks/*" = ["E741", "E402"]

[tool.pytest.ini_options]
